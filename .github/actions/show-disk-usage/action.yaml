name: 'Show disk usage'
description: 'Show information about disk usage'
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        cd $GITHUB_WORKSPACE
        pwd
        set -x
        df -h
        sudo ls -lRh /tmp/* || true
        sudo du -sh /tmp || true
        sudo du -sh /tmp/* || true
        sudo find /tmp/ -size +5M | sudo xargs ls -lh || true
        sudo du -sh ./* || true
        sudo find ./ -size +5M   | xargs ls -lh  || true
        sudo du -sh /var/ || true
        sudo du -sh /var/lib/docker/ || true
        sudo du -sh $HOME || true
        sudo du -sh /home/runner/work/ || true
        set +x
